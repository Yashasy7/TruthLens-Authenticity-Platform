# =============================================================================
# TruthLens Backend — application.properties
# Stage 5: JWT Authentication — token generation, validation, security filter.
#
# SECURITY: No credentials are stored in this file.
# All sensitive values are supplied via environment variables:
#   TRUTHLENS_DB_URL       — JDBC URL (e.g. jdbc:postgresql://localhost:5432/truthlens)
#   TRUTHLENS_DB_USERNAME  — Database username (e.g. postgres)
#   TRUTHLENS_DB_PASSWORD  — Database password (never stored in source control)
#   TRUTHLENS_JWT_SECRET   — JWT signing key (256+ bits, never stored in source control)
# =============================================================================

spring.application.name=truthlens-backend

# ---------------------------------------------------------------------------
# DataSource — PostgreSQL
# Values are resolved from environment variables at runtime.
# ---------------------------------------------------------------------------
spring.datasource.url=${TRUTHLENS_DB_URL}
spring.datasource.username=${TRUTHLENS_DB_USERNAME}
spring.datasource.password=${TRUTHLENS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# Spring Data JPA / Hibernate
# ---------------------------------------------------------------------------

# dialect: omitted — Hibernate 6 auto-detects PostgreSQLDialect from the
# JDBC driver. Specifying it explicitly triggers deprecation warning HHH90000025.

# ddl-auto=validate: Flyway owns all DDL. Hibernate validates that JPA entity
# mappings match the schema that Flyway has already applied. This will catch
# any mismatch between entities and the migrated schema at startup.
spring.jpa.hibernate.ddl-auto=validate

# Disable Open Session in View — this is a REST API, not a Thymeleaf app.
# Leaving it enabled causes database connections to be held for the entire
# HTTP request lifecycle, which is wasteful and produces a startup WARNING.
spring.jpa.open-in-view=false

# Show SQL statements in the development log for visibility.
# Set to false before any production or staging deployment.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Flyway — versioned schema migration
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate=false: the database is expected to be empty; Flyway must
# run V1 from scratch. Set to true only if migrating a pre-existing schema.
spring.flyway.baseline-on-migrate=false

# ---------------------------------------------------------------------------
# JWT Configuration (Stage 5)
# ---------------------------------------------------------------------------
truthlens.jwt.secret=${TRUTHLENS_JWT_SECRET}
truthlens.jwt.expiration-ms=${TRUTHLENS_JWT_EXPIRATION_MS:86400000}

# ---------------------------------------------------------------------------
# Multipart & Media Ingestion (Module 02)
# ---------------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# Quarantined storage configuration
truthlens.storage.quarantine-dir=${TRUTHLENS_STORAGE_QUARANTINE_DIR:./storage/quarantine}
truthlens.media.max-file-size-bytes=${TRUTHLENS_MAX_FILE_SIZE_BYTES:104857600}

