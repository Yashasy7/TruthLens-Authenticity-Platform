# =============================================================================
# TruthLens Backend — application.properties
# Stage 2: PostgreSQL + Spring Boot application configuration.
#
# SECURITY: No credentials are stored in this file.
# All sensitive values are supplied via environment variables:
#   TRUTHLENS_DB_URL       — JDBC URL (e.g. jdbc:postgresql://localhost:5432/truthlens)
#   TRUTHLENS_DB_USERNAME  — Database username (e.g. postgres)
#   TRUTHLENS_DB_PASSWORD  — Database password (never stored in source control)
# =============================================================================

spring.application.name=truthlens-backend

# ---------------------------------------------------------------------------
# DataSource — PostgreSQL
# Values are resolved from environment variables at runtime.
# ---------------------------------------------------------------------------
spring.datasource.url=${TRUTHLENS_DB_URL}
spring.datasource.username=${TRUTHLENS_DB_USERNAME}
spring.datasource.password=${TRUTHLENS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# Spring Data JPA / Hibernate
# ---------------------------------------------------------------------------

# dialect: omitted — Hibernate 6 auto-detects PostgreSQLDialect from the
# JDBC driver. Specifying it explicitly triggers deprecation warning HHH90000025.

# ddl-auto=none: Hibernate must not create, alter, or drop any schema objects.
# No JPA entities exist at this stage; schema management will be addressed
# when entities are introduced in a later stage of Module 01.
spring.jpa.hibernate.ddl-auto=none

# Disable Open Session in View — this is a REST API, not a Thymeleaf app.
# Leaving it enabled causes database connections to be held for the entire
# HTTP request lifecycle, which is wasteful and produces a startup WARNING.
spring.jpa.open-in-view=false

# Show SQL statements in the development log for visibility.
# Set to false before any production or staging deployment.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Spring Security — development placeholder
# A full SecurityFilterChain will be configured in a later stage.
# ---------------------------------------------------------------------------
