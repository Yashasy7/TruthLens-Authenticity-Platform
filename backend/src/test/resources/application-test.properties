# =============================================================================
# TruthLens Backend — application-test.properties
# Test profile configuration for backend tests.
#
# Configures in-memory PostgreSQL-compatible H2 database for real Flyway
# migration and repository integration tests without external infrastructure.
# =============================================================================

# Test-only JWT configuration — strictly for automated test execution.
truthlens.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
truthlens.jwt.expiration-ms=3600000

# Test quarantined storage configuration
truthlens.storage.quarantine-dir=target/test-quarantine
truthlens.media.max-file-size-bytes=104857600

# -----------------------------------------------------------------------------
# Test Database — H2 in PostgreSQL compatibility mode
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:truthlens;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway execution on in-memory test database
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
